services:

  api:
    build: .
    container_name: fraud-api
    ports:
      - "4601:8000"
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 3s
      retries: 3
    networks:
      - fraud_net
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: fraud-prometheus
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "4604:9090"
    depends_on:
      - api
    networks:
      - fraud_net
    restart: unless-stopped

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.17.2
    container_name: fraud-mlflow
    working_dir: /mlflow
    volumes:
      - ./mlflow_snapshot/mlflow.db:/mlflow/mlflow.db:ro
      - ./mlflow_snapshot/mlruns:/mlflow/mlruns:ro
    command: mlflow server --backend-store-uri sqlite:///mlflow.db --default-artifact-root /mlflow/mlruns --host 0.0.0.0 --port 5000
    ports:
      - "4602:5000"
    networks:
      - fraud_net
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.5.1
    container_name: fraud-grafana
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    ports:
      - "4603:3000"
    depends_on:
      - prometheus
    networks:
      - fraud_net
    restart: unless-stopped

volumes:
  prometheus_data:
  grafana_data:

networks:
  fraud_net:
    driver: bridge