services:

  api:
    build: .
    container_name: fraud-api
    ports:
      - "4601:8000"
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 3s
      retries: 3
    networks:
      - fraud_net
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: fraud-prometheus
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "4604:9090"
    depends_on:
      - api
    networks:
      - fraud_net
    restart: unless-stopped

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.17.2
    container_name: fraud-mlflow
    working_dir: /mlflow
    volumes:
      - ./mlflow_snapshot/mlflow.db:/mlflow/mlflow.db:ro
      - ./mlflow_snapshot/mlruns:/mlflow/mlruns:ro
    command: mlflow server --backend-store-uri sqlite:///mlflow.db --default-artifact-root /mlflow/mlruns --host 0.0.0.0 --port 5000
    ports:
      - "4602:5000"
    networks:
      - fraud_net
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.5.1
    container_name: fraud-grafana
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    ports:
      - "4603:3000"
    depends_on:
      - prometheus
    networks:
      - fraud_net
    restart: unless-stopped

  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: fraud-minio
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-admin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-admin12345}
    volumes:
      - minio_data_v2:/data
    ports:
      - "4605:9000"
      - "4606:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - fraud_net
    restart: unless-stopped

  platform-api:
    build:
      context: .
      dockerfile: Dockerfile.platform
    container_name: fraud-platform-api
    volumes:
      - .:/app
    environment:
      - PYTHONUNBUFFERED=1
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-admin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-admin12345}
    ports:
      - "4607:8000"
    depends_on:
      - minio
    networks:
      - fraud_net
    restart: unless-stopped

volumes:
  prometheus_data:
  grafana_data:
  minio_data_v2:

networks:
  fraud_net:
    driver: bridge