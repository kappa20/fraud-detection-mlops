name: ML Pipeline CI

# Reprend et étend l'exemple donné en cours (Chapitre 2, "CI avec GitHub
# Actions"). Principe cité en cours : "Chaque push déclenche automatiquement
# la validation complète du pipeline. Un pipeline qui ne passe pas les
# tests ne peut pas être mergé."
#
# Déploiement continu gardé : le job `deploy` ne tourne que si `test` est vert,
# uniquement sur un push vers main (jamais sur une pull request). Il remplace le
# webhook GitHub -> Komodo, qui déployait même quand la CI échouait — ce webhook
# doit être supprimé (voir docs/03_installation.md, "Déploiement continu").
#
# La CI ne dépend jamais du vrai dataset Kaggle (non versionné, voir
# data/README.md) : elle exerce le pipeline complet (ingestion -> qualité
# -> transformation -> ML -> API conteneurisée) sur une fixture
# synthétique générée à la volée (scripts/make_sample_fixture.py).

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Unit tests (API, validation, métriques ML)
        run: pytest tests/ -v

      - name: Générer la fixture synthétique (pas de données Kaggle réelles en CI)
        run: python scripts/make_sample_fixture.py

      - name: Ingestion dlt (fixture -> DuckDB)
        run: python ingestion_dlt/run_pipeline.py --csv tests/fixtures/sample_transactions.csv --duckdb fraud_detection.duckdb

      - name: Validation shift-left du schéma
        run: python quality/validate_schema.py --duckdb fraud_detection.duckdb

      - name: dbt build (staging + marts + tests qualité)
        working-directory: dbt_fraud
        run: dbt build --profiles-dir .

      - name: Entraînement du modèle (sur la fixture)
        run: python ml/train.py

      - name: Enregistrement du modèle (Model Registry + export .pkl)
        run: python ml/register_model.py

      - name: Build de l'image Docker du service
        run: docker build -t fraud-api:ci .

      - name: Définitions Dagster (jobs, schedule, sensor) chargeables
        run: |
          python - <<'PY'
          from orchestration_dagster.fraud_dagster.job import defs
          jobs = {j.name for j in defs.jobs}
          assert jobs == {"fraud_pipeline_job", "continuous_training_job"}, jobs
          assert [s.name for s in defs.schedules] == ["nightly_pipeline_schedule"]
          assert [s.name for s in defs.sensors] == ["dataset_version_sensor"]
          print("Dagster OK :", sorted(jobs))
          PY

      - name: Règles Prometheus (syntaxe + tests unitaires des alertes)
        run: |
          docker run --rm --entrypoint promtool -v "$PWD/monitoring/prometheus:/etc/prometheus:ro" \
            prom/prometheus:v2.55.1 check config /etc/prometheus/prometheus.yml
          docker run --rm --entrypoint promtool -v "$PWD/monitoring/prometheus:/etc/prometheus:ro" \
            prom/prometheus:v2.55.1 test rules /etc/prometheus/alerts_test.yml

      - name: Build de l'image du serveur MLflow
        run: docker build -f Dockerfile.mlflow -t fraud-mlflow:ci .

  deploy:
    name: Déploiement Komodo (si les tests passent)
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Un seul déploiement à la fois ; un push plus récent attend la fin du courant.
    concurrency:
      group: komodo-deploy
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Redéployer la stack via l'API Komodo
        run: python scripts/komodo_deploy.py
        env:
          KOMODO_URL: ${{ secrets.KOMODO_URL }}
          KOMODO_API_KEY: ${{ secrets.KOMODO_API_KEY }}
          KOMODO_API_SECRET: ${{ secrets.KOMODO_API_SECRET }}
          KOMODO_STACK: ${{ secrets.KOMODO_STACK }}
          # Variable (Settings > Variables), ex. http://exp.s3.fsbm.ma:4607/health
          DEPLOY_HEALTH_URL: ${{ vars.DEPLOY_HEALTH_URL }}
